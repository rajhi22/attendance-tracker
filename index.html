<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="p-6 md:p-10">
    <div class="container mx-auto max-w-2xl">
        <div class="card p-6 md:p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Attendance Tracker</h1>

            <!-- Add Class Form -->
            <div class="bg-gray-100 p-4 md:p-6 rounded-lg mb-6">
                <form id="addClassForm" class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="classNameInput" placeholder="Enter Class Name" required
                        class="flex-grow p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <button type="submit" class="btn-primary w-full sm:w-auto">Add Class</button>
                </form>
            </div>

            <!-- Overall Summary -->
            <div id="overallSummary" class="bg-gray-100 p-4 md:p-6 rounded-lg text-center mb-6">
                <p class="text-lg font-semibold text-gray-700">Overall Attendance</p>
                <p id="overallPercentage" class="text-4xl font-bold text-indigo-600 mt-2">--%</p>
            </div>

            <!-- Classes List -->
            <div id="classesList"></div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="hidden modal-overlay">
        <div class="card p-6 w-full max-w-sm text-center">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Are you sure?</h3>
            <p id="modalMessage" class="text-gray-600 mb-6">Do you want to delete this class?</p>
            <div class="flex justify-center gap-4">
                <button id="cancelBtn" class="btn-gray px-4 py-2 rounded-lg">Cancel</button>
                <button id="confirmBtn" class="btn-red px-4 py-2 rounded-lg">Confirm</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
